<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEJA Dr. Gerardo Camelo Madeira - Frequência Diária</title>
    <!-- Biblioteca para leitura de ficheiros Excel (SheetJS) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --secondary-color: #0d9488;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --success-color: #16a34a;
            --danger-color: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        .hidden { display: none !important; }

        /* Login */
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: var(--card-bg); padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        .login-card h1 { font-size: 1.2rem; color: var(--primary-color); margin-bottom: 6px; }
        .login-card h2 { font-size: 0.9rem; color: #64748b; margin-bottom: 20px; font-weight: 400; }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; outline: none; }

        .btn-primary { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background-color: var(--primary-hover); }

        /* Header & Nav */
        header { background-color: var(--primary-color); color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .btn-logout { background: rgba(255,255,255,0.15); color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }

        /* Main Content */
        main { padding: 30px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .filter-panel { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; align-items: end; }

        /* Table */
        .table-card { background: var(--card-bg); border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th, td { padding: 14px 18px; border-bottom: 1px solid #f1f5f9; }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; }

        .status-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: #fff; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .status-btn.presente { background-color: #dcfce7; color: var(--success-color); border-color: #86efac; }
        .status-btn.falta { background-color: #fee2e2; color: var(--danger-color); border-color: #fca5a5; }

        /* Import Section */
        .admin-section { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px dashed var(--primary-color); margin-top: 30px; }
        .admin-section h3 { margin-bottom: 10px; color: var(--primary-color); font-size: 1rem; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="login-container">
        <div class="login-card">
            <h1>CEJA Dr. Gerardo Camelo Madeira</h1>
            <h2>Portal de Frequência Diária</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Utilizador</label>
                    <input type="text" id="username" required placeholder="Digite o utilizador">
                </div>
                <div class="form-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="main-app" class="hidden">
        <header>
            <div>
                <h1 style="font-size: 1.2rem;">CEJA Dr. Gerardo Camelo Madeira</h1>
                <p style="font-size: 0.85rem; opacity: 0.8;">Sincronização em Tempo Real</p>
            </div>
            <button id="logout-btn" class="btn-logout">Sair</button>
        </header>

        <main>
            <!-- Filtros de Histórico -->
            <section class="filter-panel">
                <div class="form-group" style="margin:0;">
                    <label for="filter-ano">Ano Letivo</label>
                    <select id="filter-ano" onchange="carregarFrequencia()">
                        <option value="2026" selected>2026</option>
                        <option value="2025">2025</option>
                    </select>
                </div>

                <div class="form-group" style="margin:0;">
                    <label for="filter-area">Área do Conhecimento</label>
                    <select id="filter-area" onchange="carregarFrequencia()">
                        <option value="linguagens">Linguagens e Códigos</option>
                        <option value="matematica">Matemática</option>
                        <option value="humanas">Ciências Humanas</option>
                        <option value="natureza">Ciências da Natureza</option>
                    </select>
                </div>

                <div class="form-group" style="margin:0;">
                    <label for="filter-mes">Mês</label>
                    <select id="filter-mes" onchange="carregarFrequencia()">
                        <option value="01">Janeiro</option>
                        <option value="02">Fevereiro</option>
                        <option value="03">Março</option>
                        <option value="04">Abril</option>
                        <option value="05">Maio</option>
                        <option value="06">Junho</option>
                        <option value="07">Julho</option>
                        <option value="08">Agosto</option>
                        <option value="09" selected>Setembro</option>
                        <option value="10">Outubro</option>
                        <option value="11">Novembro</option>
                        <option value="12">Dezembro</option>
                    </select>
                </div>

                <div class="form-group" style="margin:0;">
                    <label for="filter-dia">Dia</label>
                    <input type="number" id="filter-dia" min="1" max="31" value="22" onchange="carregarFrequencia()">
                </div>
            </section>

            <!-- Tabela de Alunos -->
            <section class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>Matrícula</th>
                            <th>Nome do Estudante</th>
                            <th>Última Atualização</th>
                            <th style="text-align: center;">Frequência</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body">
                        <!-- Dados carregados dinamicamente do Firebase -->
                    </tbody>
                </table>
            </section>

            <!-- Painel do Administrador: Importar Alunos via Excel -->
            <section class="admin-section">
                <h3>Carregar Lista de Alunos (Ficheiro Excel / CSV)</h3>
                <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">
                    Selecione um ficheiro Excel com as colunas: <strong>Matricula</strong>, <strong>Nome</strong> e <strong>Area</strong>.
                </p>
                <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" />
                <button class="btn-primary" style="width: auto; padding: 8px 16px; margin-top: 10px;" onclick="importarExcel()">Carregar Alunos no Firebase</button>
            </section>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // CONFIGURAÇÃO DO FIREBASE (ATENDIMENTOS-CEJA)
        const firebaseConfig = {
            apiKey: "AIzaSyCg7l7axov73nQU1qlIG3NBWw8SWrPFX4",
            authDomain: "atendimentos-ceja.firebaseapp.com",
            databaseURL: "https://atendimentos-ceja-default-rtdb.firebaseio.com",
            projectId: "atendimentos-ceja",
            storageBucket: "atendimentos-ceja.firebasestorage.app",
            messagingSenderId: "330609197724",
            appId: "1:330609197724:web:45b030f4c6f1cc5faf6359"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let refFrequenciaAtual = null;

        // Login / Logout
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            carregarFrequencia();
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        });

        // CARREGAR FREQUÊNCIA EM TEMPO REAL
        function carregarFrequencia() {
            const ano = document.getElementById('filter-ano').value;
            const mes = document.getElementById('filter-mes').value;
            const dia = String(document.getElementById('filter-dia').value).padStart(2, '0');
            const area = document.getElementById('filter-area').value;

            const caminhoHistorial = `frequencia/${ano}/${mes}/${dia}/${area}`;

            if (refFrequenciaAtual) {
                refFrequenciaAtual.off();
            }

            db.ref(`alunos/${area}`).once('value', (snapshotAlunos) => {
                const alunos = snapshotAlunos.val() || {};
                
                refFrequenciaAtual = db.ref(caminhoHistorial);
                refFrequenciaAtual.on('value', (snapshotFreq) => {
                    const frequencias = snapshotFreq.val() || {};
                    renderizarTabela(alunos, frequencias, caminhoHistorial);
                });
            });
        }

        // RENDERIZAR TABELA COM DADOS SINCRONIZADOS
        function renderizarTabela(alunos, frequencias, caminho) {
            const tbody = document.getElementById('student-table-body');
            tbody.innerHTML = '';

            const ids = Object.keys(alunos);
            if (ids.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum aluno registado nesta área. Utilize o importador abaixo.</td></tr>';
                return;
            }

            ids.forEach(id => {
                const aluno = alunos[id];
                const freqInfo = frequencias[id] || { status: 'falta', hora: '-' };
                const isPresente = freqInfo.status === 'presente';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${aluno.matricula}</td>
                    <td>${aluno.nome}</td>
                    <td id="hora-${id}">${freqInfo.hora || '-'}</td>
                    <td style="text-align: center;">
                        <button class="status-btn ${isPresente ? 'presente' : 'falta'}" 
                                onclick="alternarPresenca('${caminho}', '${id}', '${isPresente ? 'falta' : 'presente'}')">
                            ${isPresente ? 'Presença' : 'Falta'}
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ATUALIZAR ESTADO DE FREQUÊNCIA NO FIREBASE
        function alternarPresenca(caminho, alunoId, novoStatus) {
            const horaAtual = new Date().toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
            
            db.ref(`${caminho}/${alunoId}`).set({
                status: novoStatus,
                hora: horaAtual,
                utilizador: document.getElementById('username').value || 'Professor'
            });
        }

        // IMPORTAR EXCEL/CSV PARA O FIREBASE
        function importarExcel() {
            const fileInput = document.getElementById('excel-file');
            const file = fileInput.files[0];

            if (!file) {
                alert('Por favor, selecione um ficheiro Excel.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = XLSX.utils.sheet_to_json(firstSheet);

                let contagem = 0;
                rows.forEach(row => {
                    if (row.Matricula && row.Nome && row.Area) {
                        const area = String(row.Area).toLowerCase().trim();
                        db.ref(`alunos/${area}/${row.Matricula}`).set({
                            matricula: row.Matricula,
                            nome: row.Nome
                        });
                        contagem++;
                    }
                });

                alert(`${contagem} alunos importados com sucesso!`);
                carregarFrequencia();
            };
            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
